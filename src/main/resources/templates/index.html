<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="/css/style.css" rel="stylesheet">
        <title>User page</title>
    </head>

    <body class="min-vh-100">
        <nav class="navbar sticky-top bd-navbar bg-dark p-2">
            <div class="container-fluid d-flex justify-content-start flex-nowrap ">
                <span class="navbar-brand text-white fw-bold fs-5 m-0" th:text="${user.getEmail()}">Username</span>
                <span class="navbar-text text-white fs-5" th:utext="|&nbsp;with&nbsp;roles:&nbsp;|">with&nbsp;roles:</span>
                <span class="navbar-text text-white fs-5" th:each="role : ${user.getAuthorities()}" th:utext="|${role}&nbsp;|">ROLE</span>
                <div class="nav-item d-flex w-100 justify-content-end">
                    <a class="nav-link text-white-50 fs-5" href="/logout">Logout</a>
                </div>
            </div>
        </nav>

        <div class="d-flex my-3">
            <div id="sidebar" class="container d-flex flex-column flex-shrink-1 bg-light p-0">
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a class="nav-link rounded-1" href="#" th:href="@{/admin}" th:if="${user.getAuthorities().contains(ROLE_ADMIN)}">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded-1 active" href="#">User</a>
                    </li>
                </ul>
            </div>

            <div class="container d-flex flex-column flex-shrink-1 bg-light px-4 w-100">
                <div>
                    <h1 class="fw-bold">User information-page</h1>
                </div>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="allUsers">
                        <div class="p-2">
                            <span class="table-header fw-medium fs-5">About user</span>
                        </div>
                        <div class="p-3 bg-white">
                            <table class="table table-striped table-hover align-middle">
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">First name</th>
                                    <th scope="col">Last Name</th>
                                    <th scope="col">Password</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Role</th>
                                </tr>
                                <tr>
                                    <td th:text="${user.getId()}">ID</td>
                                    <td th:text="${user.getUsername()}">First name</td>
                                    <td th:text="${user.getSurname}">Last Name</td>
                                    <td th:text="${user.getPassword()}">Password</td>
                                    <td th:text="${user.getEmail()}">Email</td>
                                    <td th:text="${#strings.listJoin(user.getAuthorities(), ' ')}">ROLE</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

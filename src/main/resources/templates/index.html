<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <script src="/js/bootstrap.bundle.min.js"></script>
        <link href="/css/style.css" rel="stylesheet">
        <script src="/js/user.js"></script>
        <title>User page</title>
    </head>

    <body class="min-vh-100">
        <nav class="navbar sticky-top bd-navbar bg-dark p-2">
            <div class="container-fluid d-flex justify-content-start flex-nowrap ">
                <span class="user-name navbar-brand text-white fw-bold fs-5 m-0">Username</span>
                <span class="navbar-text text-white fs-5">&nbsp;with&nbsp;roles:&nbsp;</span>
                <span class="user-role navbar-text text-white fs-5">ROLE</span>
                <div class="nav-item d-flex flex-fill justify-content-end">
                    <a class="nav-link text-white-50 fs-5" href="/logout">Logout</a>
                </div>
            </div>
        </nav>

        <div class="d-flex my-3">
            <div id="sidebar" class="container d-flex flex-column flex-shrink-1 bg-light p-0 m-0 fix-size">
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a class="role-admin nav-link rounded-1" href="/admin">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded-1 active" href="#">User</a>
                    </li>
                </ul>
            </div>

            <div class="container d-flex flex-column flex-shrink-1 bg-light px-4 w-100">
                <div>
                    <h1 class="fw-bold">User information-page</h1>
                </div>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="allUsers">
                        <div class="p-2">
                            <span class="table-header fw-medium fs-5">About user</span>
                        </div>
                        <div class="p-3 bg-white">
                            <table class="table table-striped table-hover align-middle">
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">First name</th>
                                    <th scope="col">Last Name</th>
                                    <th scope="col">Password</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Role</th>
                                </tr>
                                <tr>
                                    <td class="user-id">ID</td>
                                    <td class="user-name">First name</td>
                                    <td class="user-surname">Last Name</td>
                                    <td class="user-password">Password</td>
                                    <td class="user-email">Email</td>
                                    <td class="user-role">ROLE</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/devdbtest
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver
    thymeleaf:
        suffix: .html
        prefix: classpath:/templates/
        cache: false
    jpa:
        properties.hibernate:
            show_sql: true
            format_sql: true
            highlight_sql: true
            current_session_context_class: managed
            hbm2ddl.auto: create-drop

logging.level:
    org.springframework: info
    org.hibernate: info